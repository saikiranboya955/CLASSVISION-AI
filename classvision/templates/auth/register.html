{% extends "base.html" %}

{% block auth_content %}
<div style="min-height: 100vh; width: 100vw; display: flex; flex-direction: column; background: radial-gradient(circle at 30% 50%, #0b132b 0%, #030712 100%); position: relative; overflow-x: hidden;">
    
    <!-- Registration Body -->
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; max-width: 1200px; width: 100%; margin: 0 auto; padding: 2rem;">
        
        <div style="max-width: 520px; width: 100%; z-index: 10;">
            <div style="background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 24px; padding: 2.5rem 2.25rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1); position: relative; overflow: hidden;">
                
                <!-- Glowing Top Accent Line -->
                <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #3b82f6, #8b5cf6, #00f5d4, #3b82f6); background-size: 200% 100%; animation: gradientGlow 4s linear infinite;"></div>
                
                <!-- Header Badge -->
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 16px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);">
                        👨‍🏫
                    </div>
                    <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; margin-bottom: 0.25rem;">
                        Faculty Registration
                    </h1>
                    <p style="color: #94a3b8; font-size: 0.85rem;">Create your ClassVision AI portal account</p>
                </div>

                <!-- Registration Form -->
                <form method="POST" id="registerForm" autocomplete="off">
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label for="name" style="color: #cbd5e1; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block;">Full Name *</label>
                        <div style="position: relative;">
                            <input type="text" id="name" name="name" required placeholder="Dr. Jane Doe" value="{{ name or '' }}" style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; background: rgba(2, 6, 23, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #f8fafc; font-size: 0.95rem; transition: all 0.3s ease;">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.1rem;">🎓</span>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label for="faculty_id" style="color: #cbd5e1; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block;">Faculty ID / Email *</label>
                        <div style="position: relative;">
                            <input type="text" id="faculty_id" name="faculty_id" required placeholder="FAC202601 or email@college.edu" value="{{ faculty_id or '' }}" style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; background: rgba(2, 6, 23, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #f8fafc; font-size: 0.95rem; transition: all 0.3s ease;">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.1rem;">🆔</span>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 1.2rem;">
                        <label for="department" style="color: #cbd5e1; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block;">Department *</label>
                        <div style="position: relative;">
                            <input type="text" id="department" name="department" required placeholder="Computer Science & Engineering" value="{{ department or '' }}" style="width: 100%; padding: 0.8rem 1rem 0.8rem 2.6rem; background: rgba(2, 6, 23, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #f8fafc; font-size: 0.95rem; transition: all 0.3s ease;">
                            <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.1rem;">🏛️</span>
                        </div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="password" style="color: #cbd5e1; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block;">Password *</label>
                            <input type="password" id="password" name="password" required placeholder="Min 6 chars" style="width: 100%; padding: 0.8rem 1rem; background: rgba(2, 6, 23, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #f8fafc; font-size: 0.9rem;">
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="confirm_password" style="color: #cbd5e1; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block;">Confirm *</label>
                            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password" style="width: 100%; padding: 0.8rem 1rem; background: rgba(2, 6, 23, 0.75); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 12px; color: #f8fafc; font-size: 0.9rem;">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1rem; font-weight: 600; border-radius: 12px; background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); border: none; color: #ffffff; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <span>Create Account</span>
                        <span>→</span>
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid rgba(148, 163, 184, 0.1); font-size: 0.875rem;">
                    <span style="color: #94a3b8;">Already registered?</span>
                    <a href="{{ url_for('login') }}" style="color: #60a5fa; font-weight: 600; text-decoration: none; margin-left: 6px;">Sign In</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer Section -->
    <footer style="padding: 1.5rem; text-align: center; border-top: 1px solid rgba(148, 163, 184, 0.1); background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(10px); z-index: 10;">
        <p style="color: #f8fafc; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px;">
            Powered by AI Face Recognition
        </p>
        <p style="color: #60a5fa; font-size: 0.775rem; font-weight: 500; letter-spacing: 0.05em;">
            OpenCV • Flask • SQLite • Python • LBPH • WebRTC
        </p>
    </footer>
</div>

<style>
@keyframes gradientGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
</style>

<script>
document.getElementById('registerForm').addEventListener('submit', function() {
    const btn = this.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.innerHTML = '<span>Registering Account...</span>';
});
</script>
{% endblock %}
